name: Live devnet verification
on:
  pull_request:
    paths:
      - '.github/workflows/devnet-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-devnet:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check application and transaction construction
        run: |
          npm test
          node scripts/check-rules-tx.cjs
          npm run build
      - name: Check original devnet test-wallet funding
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const wallet = 'nxPwUwqc7WUaEuojFGTLPQz4RnCmkc3QvpeEmBVM7M4';
            const response = await fetch('https://api.devnet.solana.com', {
              method: 'POST',
              headers: {'content-type': 'application/json'},
              body: JSON.stringify({jsonrpc:'2.0',id:1,method:'getBalance',params:[wallet,{commitment:'confirmed'}]}),
              signal: AbortSignal.timeout(20000)
            });
            if (!response.ok) throw new Error('Devnet RPC HTTP ' + response.status);
            const body = await response.json();
            if (body.error) throw new Error(JSON.stringify(body.error));
            if (!Number.isFinite(body.result?.value)) throw new Error('No valid balance returned');
            const report = {network:'solana-devnet',checkedAt:new Date().toISOString(),wallet,lamports:body.result.value,sol:body.result.value/1e9};
            fs.writeFileSync('DEVNET-FUNDING-STATUS.json',JSON.stringify(report,null,2)+'\n');
            console.log('CLIQUE_FUNDING_REPORT_START');
            console.log(JSON.stringify(report));
            console.log('CLIQUE_FUNDING_REPORT_END');
          })().catch(error => {console.error(error.message);process.exit(1)});
          NODE
      - name: Run real devnet lifecycle using a fresh disposable test wallet
        run: node scripts/devnet-smoke.cjs
      - name: Print successful transaction receipts
        run: |
          node -e "console.log('CLIQUE_VERIFICATION_REPORT_START');console.log(require('node:fs').readFileSync('DEVNET-VERIFICATION.json','utf8'));console.log('CLIQUE_VERIFICATION_REPORT_END')"
      - name: Preserve public verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clique-devnet-verification
          path: |
            DEVNET-FUNDING-STATUS.json
            DEVNET-VERIFICATION.json
          if-no-files-found: warn
          retention-days: 30
